stages: [test, deploy]

matrix_test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ['3.11', '3.12']
  image: python:$PYTHON_VERSION
  script:
    - python --version

review:
  stage: deploy
  script: ["./deploy.sh review"]
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    on_stop: stop_review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stop_review:
  stage: deploy
  script: ["./destroy.sh review"]
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  when: manual
