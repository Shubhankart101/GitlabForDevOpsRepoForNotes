stages: [validate, build, deploy]

variables:
  IMAGE: "$ECR_REGISTRY/devtrack:$CI_COMMIT_SHORT_SHA"

validate:
  stage: validate
  image: alpine:3.20
  script:
    - test -f Dockerfile
    - echo "AWS pipeline validation passed"

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker build --pull -t "$IMAGE" .
    - docker push "$IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_eks:
  stage: deploy
  image: amazon/aws-cli:2.17.0
  script:
    - aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name "$EKS_CLUSTER"
    - kubectl set image deployment/devtrack web="$IMAGE" --namespace devtrack
    - kubectl rollout status deployment/devtrack --namespace devtrack
  environment: production
  when: manual
