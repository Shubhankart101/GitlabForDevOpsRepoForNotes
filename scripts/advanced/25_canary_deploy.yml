stages: [deploy, verify]
canary:
  stage: deploy
  script: ["./deploy.sh canary"]
  environment: canary
verify_canary:
  stage: verify
  needs: [canary]
  script: ["./smoke-test.sh canary"]
production:
  stage: deploy
  needs: [verify_canary]
  script: ["./deploy.sh production"]
  when: manual
  environment: production
